<!DOCTYPE html>
<html>

<head>
  <title>Edit Post</title>
</head>

<body>
  <h1>Edit Post</h1>
  <form action="/update_item" method="post">
    <p>
      Title: <br />
      <input type="text" name = "title" value = "{{item.title}}" maxlength="50" required"/>
    </p>
    <p>
      Description <br/>
      <textarea name = "description" rows = "8" cols ="60" maxlength="500" required>{{item.description}}  </textarea>
    </p>
    
    {% for class in all_classes %}
    <p>
      {{class}}: </br>
      <select name ="classes">
        <option value="">(select)</option>
      {% for option in all_classes[class] %}
        {% if classes[class] == option %}
        <option value="{{class}}:{{option}}" selected>{{option}} </option>        
        {% else %}
        <option value="{{class}}:{{option}}">{{option}} </option>        
        {% endif%}
        {% endfor %}
      </select>
    </p>
    {% endfor %}


    <p>
      Lens focal length<br/>
      <input type="number" name = "focal_length" value = "{{item.focal_length}}" pattern="[1-9][0-9]{0,3}" required/>
    </p>
    <p>
      Location <br/>
      <input type="text" name = "location" value = "{{item.geolocation}} required"/>
    </p>
    <input type="hidden" name="item_id" value="{{item.item_id}}">
    <input type = hidden name = "csrf_token" value = {{session.csrf_token}}>
    <input type = "submit" value ="Edit post"/>

  </form>
  <p>
    <a href="/"> Back </a>
  </p>

</body>


</html>
