<!DOCTYPE html>
<html>

<head>
  <title>Edit Cinema</title>
</head>

<body>
  <h1>Edit Cinema</h1>
  <form action="/update_item" method="post">
    <p>
      Title: <br />
      <input type="text" name = "title" value = "{{item.title}}"/>
    </p>
    <p>
      Description <br/>
      <textarea name = "description" rows = "8" cols =60>{{item.description}}</textarea>
    </p>
    
    <p>
      Lens focal length<br/>
      <input type="number" name = "focal_length" value = "{{item.focal_length}}"/>
    </p>
    <p>
      Location <br/>
      <input type="text" name = "location" value = "{{item.geolocation}}"/>
    </p>
    <input type="hidden" name="item_id" value="{{item.item_id}}">
    <input type = "submit" value ="Upload item"/>

  </form>
  <p>
    <a href="/"> Back </a>
  </p>

</body>


</html>
