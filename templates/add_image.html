{% extends "layout.html" %}

{% block title %}Upload Image{% endblock %}

{% block content %}
<h2>Upload Image</h2>

<form action="/create_image" method="post" enctype ="multipart/form-data">
  <p>
    <label for="title">Title:</label> <br />
    <input type="text" name = "title" maxlength="50" required/>
  </p>
  <p>
    <label for="description">Description:</label> <br/>
    <textarea name = "description" rows = "8" cols =60 maxlength="500" required></textarea>
  </p>
  <p>
    <label for="focal_length">Lens focal length:</label> <br/>
    <input type="number" name = "focal_length" pattern="[1-9][0-9]{0,3} required"/>
  </p>
  <p>
    <label for="location">Location:</label> <br/>
    <input type="text" name = "location" required/>
  </p>
  <p>
    <label for="image">Image:</label> <br/>
    <input type="file" name="image" accept=".jpg" accept =".png" required/>
  </p>

  {% for class in classes %}
  <p>
    <label for="class{{ class }}">{{ class }}</label>: <br/>
    <select name ="classes" id="class{{ class }}">
      <option value="">(select)</option>
    {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }} </option>        
    {% endfor %}
    </select>
  </p>
  {% endfor %}

  <input type="hidden" name="csrf_token" value="{{session.csrf_token}}">
  <input type="submit" value="Upload image"/>
</form>
{% endblock %}
